<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>မြန်မာ့ရိုးရာ အင်းကွက် ဖန်တီးရေးစနစ် (Master Pro Edition)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* Custom Fonts Setup */
    @font-face {
      font-family: 'BolFont';
      src: url('bol.ttf') format('truetype'), url('Bol.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'CalligraphrRegular';
      src: url('Calligraphr-Regular.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --primary: #8b0000;
      --primary-hover: #6b0000;
      --accent: #d4af37;
      --bg: #f5f2eb;
      --surface: #ffffff;
      --surface-border: #d1c7bc;
      --text: #2c221e;
      --text-muted: #555555;
      
      --cell-text-color: #2c221e;
      --cell-bg-color: #faf8f5;
      --grid-border-color: #4a3b32;
      --font-size: 20px;
      --selected-font: 'BolFont', 'Padauk', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--selected-font), 'Padauk', sans-serif; -webkit-tap-highlight-color: transparent; }

    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px 12px 280px; }

    .header-container { text-align: center; margin-bottom: 15px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; width: 100%; max-width: 500px; }
    h2 { font-family: 'Cinzel', 'Padauk', serif; color: var(--primary); font-size: 1.35rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
    h2 i { color: var(--accent); font-size: 1.1rem; }

    .mode-switcher { display: flex; gap: 8px; margin-bottom: 12px; width: 100%; max-width: 500px; }
    .mode-switcher button { flex: 1; padding: 10px 4px; background: #e2dcd6; border: 1px solid var(--surface-border); border-radius: 8px; font-weight: bold; cursor: pointer; color: #4a3b32; font-size: 0.8rem; transition: all 0.25s ease; }
    .mode-switcher button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .toolbar, .canvas-tools { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; width: 100%; max-width: 500px; }
    .toolbar button, .canvas-tools button { background: #fff; border: 1px solid var(--primary); color: var(--primary); padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
    .toolbar button.active, .canvas-tools button.active { background: var(--primary); color: #fff; }

    .custom-grid-box { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; background: var(--surface); padding: 10px 14px; border-radius: 12px; border: 1px solid var(--surface-border); width: 100%; max-width: 500px; justify-content: center; font-size: 0.85rem; }
    .custom-grid-box input { width: 50px; padding: 6px; text-align: center; background: #fff; border: 1px solid #ccc; border-radius: 6px; outline: none; }
    .custom-grid-box button { background: var(--primary); color: #fff; border: none; padding: 7px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .customization-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; background: var(--surface); padding: 12px; border-radius: 12px; border: 1px solid var(--surface-border); width: 100%; max-width: 500px; }
    .custom-control { display: flex; flex-direction: column; gap: 4px; font-size: 0.78rem; font-weight: bold; }
    .custom-control select, .custom-control input { padding: 6px; background: #fff; border: 1px solid #ccc; border-radius: 6px; font-size: 0.82rem; outline: none; }

    #captureArea { padding: 20px; background: var(--bg); width: 100%; max-width: 500px; display: flex; justify-content: center; align-items: center; border-radius: 12px; margin-bottom: 12px; }
    
    .grid-container { background: var(--surface); padding: 16px; border: 4px double var(--grid-border-color); box-shadow: 0 5px 15px rgba(0,0,0,0.08); display: flex; justify-content: center; align-items: center; width: 100%; overflow-x: auto; position: relative; }
    .grid { display: grid; border: 2px solid var(--grid-border-color); background: transparent; }
    
    .cell { border: 1px solid var(--grid-border-color); display: flex; align-items: center; justify-content: center; font-size: var(--font-size); color: var(--cell-text-color); font-weight: bold; background: var(--cell-bg-color); cursor: text; aspect-ratio: 1 / 1; min-width: 42px; min-height: 42px; padding: 2px; text-align: center; outline: none; }
    .cell:focus { background: #ffe4b5; outline: 2px solid var(--primary); z-index: 2; }

    #circleContainer { display: none; width: 380px; height: 380px; position: relative; margin: 0 auto; }
    #circleSvg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .circle-cell { position: absolute; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--cell-text-color); font-size: var(--font-size); cursor: text; border-radius: 6px; outline: none; background: transparent; text-align: center; }
    .circle-cell:focus { background: #ffe4b5; outline: 2px dashed var(--primary); }

    /* Canvas Drawing Area */
    #canvasWrapper { position: relative; display: none; width: 450px; height: 450px; margin: 0 auto; }
    canvas { background: var(--cell-bg-color); touch-action: none; border: 2px solid var(--grid-border-color); width: 100%; height: 100%; display: block; }
    
    /* Floating Text Nodes for Smart Canvas */
    .floating-text {
      position: absolute;
      min-width: 30px;
      min-height: 30px;
      padding: 2px 6px;
      font-size: var(--font-size);
      font-weight: bold;
      color: var(--cell-text-color);
      cursor: move;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%); /* Center on click */
      white-space: nowrap;
      user-select: none;
    }
    .floating-text:focus {
      border: 1px dashed var(--primary);
      background: rgba(255, 228, 181, 0.4);
      cursor: text;
    }

    .utility-bar { display: flex; gap: 6px; margin-bottom: 10px; width: 100%; max-width: 500px; justify-content: space-between; }
    .utility-bar button { background: #fff; border: 1px solid #ccc; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
    .action-buttons { display: flex; gap: 8px; margin-top: 10px; width: 100%; max-width: 500px; }
    .action-buttons button { flex: 1; color: #fff; border: none; padding: 12px 6px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.82rem; }
    .action-buttons button.clear-btn { background: #d9534f; }
    .action-buttons button.save-btn { background: #5cb85c; }
    .action-buttons button.img-btn { background: var(--primary); }

    /* Virtual Keypad Modal UI */
    .keypad-modal { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #fdfbf7; border-top: 4px solid var(--primary); box-shadow: 0 -6px 20px rgba(0,0,0,0.25); padding: 12px 10px; z-index: 1000; border-radius: 16px 16px 0 0; max-width: 650px; margin: 0 auto; }
    .keypad-modal.show { display: block; animation: slideUp 0.2s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .keypad-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #d1c7bc; padding-bottom: 6px; }
    .kb-tabs { display: flex; gap: 5px; }
    .kb-tab-btn { background: #e2dcd6; border: none; padding: 5px 8px; border-radius: 6px; font-weight: bold; font-size: 0.75rem; cursor: pointer; }
    .kb-tab-btn.active { background: var(--primary); color: #fff; }
    .kb-scroll-container { width: 100%; overflow-x: auto; padding-bottom: 6px; }
    .kb-layout { display: none; flex-direction: column; gap: 6px; min-width: 480px; }
    .kb-layout.active { display: flex; }
    .kb-row { display: flex; gap: 6px; justify-content: center; }
    .key-btn { background: #ffffff; border: 1px solid #b8aca1; border-radius: 8px; flex: 1; padding: 10px 0; font-size: 1.05rem; font-weight: bold; text-align: center; cursor: pointer; user-select: none; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .key-btn:active { background: #e2dcd6; }
    .key-btn.action-key { background: #fae1e1; color: var(--primary); font-size: 0.8rem; }
    .key-btn.backspace-key { background: #f0e6ff; color: #4a148c; font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="header-container">
    <h2><i class="fa-solid fa-compass-drafting"></i> မြန်မာ့ရိုးရာ အင်းကွက်ဖန်တီးရေး</h2>
  </div>

  <div class="mode-switcher">
    <button id="gridModeBtn" class="active" onclick="switchMode('grid')">ဇယားကွက်</button>
    <button id="circleModeBtn" onclick="switchMode('circle')">စက်ဝိုင်းအင်း</button>
    <button id="canvasModeBtn" onclick="switchMode('canvas')">စိတ်ကြိုက်/မျဉ်းဖြောင့်</button>
  </div>

  <!-- Regular Grid Toolbar -->
  <div id="gridToolbarContainer" style="width:100%; max-width:500px;">
    <div class="toolbar" id="toolbar"></div>
    <div class="custom-grid-box">
      <label>အတန်း:</label>
      <input type="number" id="inputRows" min="1" max="25" value="3">
      <label>အတိုင်:</label>
      <input type="number" id="inputCols" min="1" max="30" value="11">
      <button onclick="applyCustomGrid()">ဖန်တီး</button>
    </div>
  </div>

  <!-- Smart Canvas Toolbar -->
  <div id="canvasToolsContainer" class="canvas-tools" style="display: none;">
    <button id="toolSmartLine" class="active" onclick="setCanvasTool('smart-line')"><i class="fa-solid fa-pen-ruler"></i> မျဉ်းဖြောင့် (Auto)</button>
    <button id="toolPen" onclick="setCanvasTool('pen')"><i class="fa-solid fa-pen"></i> လွတ်လပ်ဆွဲ</button>
    <button id="toolText" onclick="setCanvasTool('text')"><i class="fa-solid fa-font"></i> စာလုံးချရန်</button>
    <button id="toolEraser" onclick="setCanvasTool('eraser')"><i class="fa-solid fa-eraser"></i> ဖျက်ဆေး</button>
  </div>

  <div class="customization-panel">
    <div class="custom-control">
      <label>မြန်မာစာ ဖောင့်အလှ:</label>
      <select id="fontSelect" onchange="changeFontFamily()">
        <option value="'BolFont', 'Padauk', sans-serif" selected>Bol Font (Default)</option>
        <option value="'CalligraphrRegular', sans-serif">Calligraphr Font</option>
        <option value="'Padauk', sans-serif">Padauk (Standard)</option>
      </select>
    </div>
    <div class="custom-control">
      <label>Font ဖိုင် တိုက်ရိုက်တင်ရန်:</label>
      <input type="file" id="fontFileInput" accept=".ttf,.otf,.woff" onchange="loadLocalFont(this)" style="font-size:0.75rem;">
    </div>
    <div class="custom-control">
      <label>စာသား/မျဉ်းအရောင်:</label>
      <select id="textColorSelect" onchange="changeTextColor()">
        <option value="#2c221e">အနက်/အညို (Default)</option>
        <option value="#8b0000">အနီရောင်</option>
        <option value="#10b981">အစိမ်းရောင်</option>
      </select>
    </div>
    <div class="custom-control">
      <label>နောက်ခံအရောင်:</label>
      <select id="bgColorSelect" onchange="changeBgColor()">
        <option value="#f5f2eb">Parchment (မူလ)</option>
        <option value="#ffffff">အဖြူရောင်</option>
        <option value="#fae1e1">ဖျော့တော့အနီ</option>
      </select>
    </div>
    <div class="custom-control">
      <label>ဘောင်အရောင်:</label>
      <select id="borderColorSelect" onchange="changeBorderColor()">
        <option value="#4a3b32">ကြေးညိုရောင် (Default)</option>
        <option value="#d4af37">ရွှေရောင်</option>
        <option value="#8b0000">အနီရောင်</option>
      </select>
    </div>
    <div class="custom-control">
      <label>စာလုံးအရွယ်: <span id="fontSizeVal">20px</span></label>
      <input type="range" id="fontSizeRange" min="12" max="36" value="20" oninput="changeFontSize(this.value)">
    </div>
  </div>

  <div class="utility-bar">
    <div style="display:flex; gap:6px;">
      <button id="undoBtn" onclick="undoAction()" disabled><i class="fa-solid fa-rotate-left"></i></button>
      <button id="redoBtn" onclick="redoAction()" disabled><i class="fa-solid fa-rotate-right"></i></button>
    </div>
    <button onclick="openTemplatePicker()"><i class="fa-solid fa-scroll"></i> အင်းပုံစံ နမူနာ ၅ မျိုး</button>
  </div>

  <div id="captureArea">
    <div class="grid-container" id="captureContainer">
      <!-- Regular Grid -->
      <div class="grid" id="gridDisplay"></div>

      <!-- Interactive Circle Grid -->
      <div id="circleContainer">
        <svg id="circleSvg" viewBox="0 0 380 380"></svg>
        <div id="circleCellsContainer"></div>
      </div>

      <!-- Smart Canvas with Floating Elements -->
      <div id="canvasWrapper">
        <canvas id="drawCanvas" width="450" height="450"></canvas>
        <!-- Floating texts will be injected here -->
      </div>
    </div>
  </div>

  <div class="action-buttons">
    <button onclick="clearCurrentMode()" class="clear-btn"><i class="fa-solid fa-trash"></i> ရှင်းမည်</button>
    <button onclick="saveAsImage()" class="img-btn"><i class="fa-solid fa-image"></i> ပုံထုတ်မည်</button>
  </div>

  <!-- Virtual Keypad Modal -->
  <div class="keypad-modal" id="keypadModal">
    <div class="keypad-header">
      <span id="activeCellInfo" style="font-size:0.8rem; font-weight:bold; color:var(--primary);">ကွက်လပ်ရွေးချယ်ထားသည်</span>
      <div class="kb-tabs">
        <button class="kb-tab-btn active" onclick="switchKbTab('numbers')">ဂဏန်း</button>
        <button class="kb-tab-btn" onclick="switchKbTab('myanmar')">က-အ</button>
        <button class="kb-tab-btn" onclick="switchKbTab('complex')">ဗျည်းတွဲ</button>
      </div>
      <span style="cursor:pointer; color: #d9534f; font-weight:bold; font-size:0.85rem;" onclick="closeKeypad()">✕ ပိတ်</span>
    </div>

    <div class="kb-scroll-container">
      <!-- Numbers -->
      <div id="kbNumbers" class="kb-layout active">
        <div class="kb-row">
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('၁')">၁</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('၂')">၂</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('၃')">၃</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('၄')">၄</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('၅')">၅</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('၆')">၆</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('၇')">၇</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('၈')">၈</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('၉')">၉</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('၀')">၀</div>
        </div>
        <div class="kb-row">
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('1')">1</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('2')">2</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('3')">3</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('4')">4</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('5')">5</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('6')">6</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('7')">7</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('8')">8</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('9')">9</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('0')">0</div>
          <div class="key-btn backspace-key" onmousedown="event.preventDefault(); backspaceValue()">⌫</div>
        </div>
      </div>

      <!-- Myanmar (က-အ) -->
      <div id="kbMyanmar" class="kb-layout">
        <div class="kb-row">
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('က')">က</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ခ')">ခ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဂ')">ဂ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဃ')">ဃ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('င')">င</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('စ')">စ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဆ')">ဆ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဇ')">ဇ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဉ')">ဉ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ည')">ည</div>
        </div>
        <div class="kb-row">
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဋ')">ဋ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဌ')">ဌ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဍ')">ဍ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဎ')">ဎ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဏ')">ဏ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('တ')">တ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ထ')">ထ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဒ')">ဒ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဓ')">ဓ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('န')">န</div>
        </div>
        <div class="kb-row">
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ပ')">ပ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဖ')">ဖ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဗ')">ဗ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဘ')">ဘ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('မ')">မ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ယ')">ယ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ရ')">ရ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('လ')">လ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဝ')">ဝ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('သ')">သ</div>
        </div>
        <div class="kb-row">
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဟ')">ဟ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဠ')">ဠ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('အ')">အ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဣ')">ဣ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဤ')">ဤ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဥ')">ဥ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဧ')">ဧ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဪ')">ဪ</div>
          <div class="key-btn backspace-key" onmousedown="event.preventDefault(); backspaceValue()">⌫</div>
        </div>
      </div>

      <!-- Complex & Asat -->
      <div id="kbComplex" class="kb-layout">
        <div class="kb-row">
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('်')">် (အသတ်)</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ျ')">ျ (ယပင့်)</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ြ')">ြ (ရရစ်)</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ွ')">ွ (ဝဆွဲ)</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ှ')">ှ (ဟထိုး)</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('င်္')">င်္ (ကင်းစီး)</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('္တ')">န္တ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('္ထ')">န္ထ</div>
        </div>
        <div class="kb-row">
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('္ဓ')">န္ဓ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('္န')">န္န</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('မ္ပ')">မ္ပ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('မ္ဘ')">မ္ဘ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('မ္မ')">မ္မ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဉ္ဇ')">ဉ္ဇ</div>
          <div class="key-btn" onmousedown="event.preventDefault(); appendValue('ဉ္စ')">ဉ္စ</div>
          <div class="key-btn backspace-key" onmousedown="event.preventDefault(); backspaceValue()">⌫ ဖျက်</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    let currentMode = 'grid'; 
    let rowsCount = 3;
    let colsCount = 11;
    let gridData = {};
    let circleData = Array(16).fill('');

    let selectedCell = null;
    let undoStack = [];
    let redoStack = [];

    // Mode Switcher
    function switchMode(mode) {
      currentMode = mode;
      closeKeypad();
      document.getElementById('gridModeBtn').classList.toggle('active', mode === 'grid');
      document.getElementById('circleModeBtn').classList.toggle('active', mode === 'circle');
      document.getElementById('canvasModeBtn').classList.toggle('active', mode === 'canvas');
      
      document.getElementById('gridToolbarContainer').style.display = (mode === 'grid') ? 'block' : 'none';
      document.getElementById('canvasToolsContainer').style.display = (mode === 'canvas') ? 'flex' : 'none';
      
      document.getElementById('gridDisplay').style.display = (mode === 'grid') ? 'grid' : 'none';
      document.getElementById('circleContainer').style.display = (mode === 'circle') ? 'block' : 'none';
      document.getElementById('canvasWrapper').style.display = (mode === 'canvas') ? 'block' : 'none';

      document.getElementById('captureContainer').style.border = (mode === 'canvas' || mode === 'circle') ? 'none' : '4px double var(--grid-border-color)';
      document.getElementById('captureContainer').style.boxShadow = (mode === 'canvas' || mode === 'circle') ? 'none' : '0 5px 15px rgba(0,0,0,0.08)';
      document.getElementById('captureContainer').style.padding = (mode === 'canvas' || mode === 'circle') ? '0' : '16px';

      if (mode === 'grid') renderGrid();
      if (mode === 'circle') { renderCircleSVG(); renderCircleCells(); }
      if (mode === 'canvas') initCanvas();
    }

    // Common Text & Editing Tools
    function autoFitFont(el, text) {
      const baseSize = parseInt(document.getElementById('fontSizeRange').value, 10) || 20;
      const str = text || '';
      if (str.length > 3) el.style.fontSize = Math.max(12, baseSize * 0.55) + 'px';
      else if (str.length > 2) el.style.fontSize = Math.max(14, baseSize * 0.75) + 'px';
      else el.style.fontSize = baseSize + 'px';
    }

    function attachEditableListeners(cell, type) {
      cell.contentEditable = "true";
      cell.setAttribute("spellcheck", "false");

      cell.addEventListener('focus', function() {
        saveState();
        selectedCell = this;
        document.getElementById('keypadModal').classList.add('show');
      });

      cell.addEventListener('input', function() {
        autoFitFont(this, this.innerText);
        if (type === 'grid') gridData[`${rowsCount}x${colsCount}`][this.dataset.index] = this.innerText;
        else if (type === 'circle') circleData[this.dataset.index] = this.innerText;
      });

      cell.addEventListener('keydown', function(e) {
        if(e.key === 'Enter') { e.preventDefault(); this.blur(); closeKeypad(); }
      });
    }

    /* Virtual Keypad using document.execCommand */
    function appendValue(val) {
      if (!selectedCell) return;
      selectedCell.focus();
      if (!document.execCommand('insertText', false, val)) selectedCell.innerText += val;
      selectedCell.dispatchEvent(new Event('input'));
    }

    function backspaceValue() {
      if (!selectedCell) return;
      selectedCell.focus();
      if (!document.execCommand('delete', false, null)) selectedCell.innerText = selectedCell.innerText.slice(0, -1);
      selectedCell.dispatchEvent(new Event('input'));
    }

    function clearValue() {
      if (!selectedCell) return;
      selectedCell.innerText = '';
      selectedCell.dispatchEvent(new Event('input'));
    }

    function closeKeypad() {
      if (selectedCell) selectedCell.blur();
      selectedCell = null;
      document.getElementById('keypadModal').classList.remove('show');
    }

    function switchKbTab(tab) {
      document.querySelectorAll('.kb-tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.kb-layout').forEach(lay => lay.classList.remove('active'));

      if (tab === 'numbers') { document.querySelectorAll('.kb-tab-btn')[0].classList.add('active'); document.getElementById('kbNumbers').classList.add('active'); }
      else if (tab === 'myanmar') { document.querySelectorAll('.kb-tab-btn')[1].classList.add('active'); document.getElementById('kbMyanmar').classList.add('active'); }
      else { document.querySelectorAll('.kb-tab-btn')[2].classList.add('active'); document.getElementById('kbComplex').classList.add('active'); }
    }

    /* Grid System */
    const presetSizes = [{r: 3, c: 3, label: '၃x၃'}, {r: 3, c: 7, label: '၃x၇'}, {r: 3, c: 11, label: '၃x၁၁'}, {r: 4, c: 4, label: '၄x၄'}, {r: 5, c: 5, label: '၅x၅'}];
    const toolbar = document.getElementById('toolbar');
    presetSizes.forEach(p => {
      const btn = document.createElement('button'); btn.innerText = p.label;
      if (p.r === rowsCount && p.c === colsCount) btn.classList.add('active');
      btn.onclick = () => switchGridSize(p.r, p.c); toolbar.appendChild(btn);
    });

    function switchGridSize(r, c) {
      saveState(); rowsCount = r; colsCount = c;
      document.getElementById('inputRows').value = r; document.getElementById('inputCols').value = c;
      document.querySelectorAll('.toolbar button').forEach(b => b.classList.toggle('active', b.innerText.includes(`${r}x${c}`)));
      renderGrid();
    }

    function applyCustomGrid() {
      const r = parseInt(document.getElementById('inputRows').value); const c = parseInt(document.getElementById('inputCols').value);
      if (r && c && r >= 1 && r <= 30 && c >= 1 && c <= 30) { saveState(); rowsCount = r; colsCount = c; renderGrid(); }
    }

    function renderGrid() {
      const grid = document.getElementById('gridDisplay');
      grid.innerHTML = ''; grid.style.gridTemplateColumns = `repeat(${colsCount}, 1fr)`; grid.style.gridTemplateRows = `repeat(${rowsCount}, 1fr)`;
      const keyStr = `${rowsCount}x${colsCount}`;
      if (!gridData[keyStr]) gridData[keyStr] = Array(rowsCount * colsCount).fill('');
      for (let i = 0; i < rowsCount * colsCount; i++) {
        const cell = document.createElement('div'); cell.className = 'cell';
        const val = gridData[keyStr][i] || ''; cell.innerText = val; autoFitFont(cell, val);
        cell.dataset.index = i; attachEditableListeners(cell, 'grid'); grid.appendChild(cell);
      }
    }

    /* Circle System */
    function renderCircleSVG() {
      const svg = document.getElementById('circleSvg');
      const stroke = getComputedStyle(document.documentElement).getPropertyValue('--grid-border-color').trim() || '#4a3b32';
      const cx = 190, cy = 190, rOuter = 170, rInner = 98;
      let markup = `<circle cx="${cx}" cy="${cy}" r="${rOuter}" stroke="${stroke}" stroke-width="2.5" fill="none" /><circle cx="${cx}" cy="${cy}" r="${rInner}" stroke="${stroke}" stroke-width="2.5" fill="none" /><line x1="${cx}" y1="${cy - rInner}" x2="${cx}" y2="${cy + rInner}" stroke="${stroke}" stroke-width="2" /><line x1="${cx - rInner}" y1="${cy}" x2="${cx + rInner}" y2="${cy}" stroke="${stroke}" stroke-width="2" />`;
      for (let i = 0; i < 12; i++) {
        let angle = (i * 30) * Math.PI / 180;
        markup += `<line x1="${cx + rInner * Math.cos(angle)}" y1="${cy + rInner * Math.sin(angle)}" x2="${cx + rOuter * Math.cos(angle)}" y2="${cy + rOuter * Math.sin(angle)}" stroke="${stroke}" stroke-width="2" />`;
      }
      svg.innerHTML = markup;
    }

    function renderCircleCells() {
      const container = document.getElementById('circleCellsContainer'); container.innerHTML = '';
      const cx = 190, cy = 190;
      const innerOffsets = [{ idx: 0, x: cx - 50, y: cy - 50 }, { idx: 1, x: cx + 5, y: cy - 50 }, { idx: 2, x: cx - 50, y: cy + 5 }, { idx: 3, x: cx + 5, y: cy + 5 }];
      innerOffsets.forEach(pos => {
        const cell = document.createElement('div'); cell.className = 'circle-cell'; cell.style.width = '45px'; cell.style.height = '45px'; cell.style.left = pos.x + 'px'; cell.style.top = pos.y + 'px';
        const val = circleData[pos.idx] || ''; cell.innerText = val; autoFitFont(cell, val); cell.dataset.index = pos.idx;
        attachEditableListeners(cell, 'circle'); container.appendChild(cell);
      });
      const rOuterMid = (98 + 170) / 2;
      for (let i = 0; i < 12; i++) {
        let midAngle = (i * 30 + 15) * Math.PI / 180;
        const cell = document.createElement('div'); cell.className = 'circle-cell'; cell.style.width = '44px'; cell.style.height = '44px';
        cell.style.left = (cx + rOuterMid * Math.cos(midAngle) - 22) + 'px'; cell.style.top = (cy + rOuterMid * Math.sin(midAngle) - 22) + 'px';
        const val = circleData[4 + i] || ''; cell.innerText = val; autoFitFont(cell, val); cell.dataset.index = 4 + i;
        attachEditableListeners(cell, 'circle'); container.appendChild(cell);
      }
    }

    /* Smart Canvas Engine (Line Snapping & Floating Text) */
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    let canvasTool = 'smart-line';
    let isDrawing = false;
    let startPos = null;
    let savedImageData = null;

    function initCanvas() {
      clearCanvasBackground();
      // Remove old floating texts
      document.querySelectorAll('.floating-text').forEach(e => e.remove());
    }

    function clearCanvasBackground() {
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--cell-bg-color').trim() || '#faf8f5';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-border-color').trim() || '#4a3b32';
      ctx.strokeRect(15, 15, canvas.width - 30, canvas.height - 30);
    }

    function setCanvasTool(tool) {
      canvasTool = tool;
      document.getElementById('toolSmartLine').classList.toggle('active', tool === 'smart-line');
      document.getElementById('toolPen').classList.toggle('active', tool === 'pen');
      document.getElementById('toolText').classList.toggle('active', tool === 'text');
      document.getElementById('toolEraser').classList.toggle('active', tool === 'eraser');
    }

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) };
    }

    // Handle Text Dropping
    document.getElementById('canvasWrapper').addEventListener('click', function(e) {
      if (canvasTool === 'text' && e.target.id === 'drawCanvas') {
        saveState();
        const rect = this.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const txt = document.createElement('div');
        txt.className = 'floating-text';
        txt.style.left = x + 'px';
        txt.style.top = y + 'px';
        txt.innerText = "က";
        
        attachEditableListeners(txt, 'floating');
        makeDraggable(txt);
        this.appendChild(txt);
        txt.focus();
      }
    });

    // Make floating text draggable
    function makeDraggable(elmnt) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      elmnt.onmousedown = dragMouseDown;
      elmnt.ontouchstart = dragMouseDown;

      function dragMouseDown(e) {
        if(canvasTool === 'text') return; // Allow normal click to edit if in text mode
        e.preventDefault();
        pos3 = e.clientX || e.touches[0].clientX;
        pos4 = e.clientY || e.touches[0].clientY;
        document.onmouseup = closeDragElement;
        document.ontouchend = closeDragElement;
        document.onmousemove = elementDrag;
        document.ontouchmove = elementDrag;
      }

      function elementDrag(e) {
        e.preventDefault();
        let clientX = e.clientX || e.touches[0].clientX;
        let clientY = e.clientY || e.touches[0].clientY;
        pos1 = pos3 - clientX;
        pos2 = pos4 - clientY;
        pos3 = clientX;
        pos4 = clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
      }

      function closeDragElement() {
        document.onmouseup = null; document.onmousemove = null;
        document.ontouchend = null; document.ontouchmove = null;
      }
    }

    canvas.addEventListener('mousedown', startDraw); canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw); canvas.addEventListener('mouseleave', stopDraw);
    canvas.addEventListener('touchstart', (e) => { if(canvasTool !== 'text') { startDraw(e); e.preventDefault(); } }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { if(canvasTool !== 'text') { draw(e); e.preventDefault(); } }, { passive: false });
    canvas.addEventListener('touchend', stopDraw);

    function startDraw(e) {
      if (canvasTool === 'text') return;
      saveState();
      isDrawing = true;
      startPos = getCanvasPos(e);
      savedImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      ctx.moveTo(startPos.x, startPos.y);
    }

    function draw(e) {
      if (!isDrawing || canvasTool === 'text') return;
      const pos = getCanvasPos(e);
      
      if (canvasTool === 'eraser') {
        ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--cell-bg-color').trim() || '#faf8f5';
        ctx.lineWidth = 20;
        ctx.lineCap = 'round';
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else if (canvasTool === 'pen') {
        ctx.strokeStyle = document.getElementById('textColorSelect').value;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else if (canvasTool === 'smart-line') {
        // Restore canvas to erase previous preview line
        ctx.putImageData(savedImageData, 0, 0);
        
        let dx = pos.x - startPos.x;
        let dy = pos.y - startPos.y;
        let angle = Math.atan2(dy, dx) * 180 / Math.PI;
        // Snap to nearest 45 degrees (Horizontal, Vertical, Diagonal)
        let snapAngle = Math.round(angle / 45) * 45;
        let rad = snapAngle * Math.PI / 180;
        let dist = Math.sqrt(dx*dx + dy*dy);
        
        let endX = startPos.x + dist * Math.cos(rad);
        let endY = startPos.y + dist * Math.sin(rad);

        ctx.strokeStyle = document.getElementById('textColorSelect').value;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(startPos.x, startPos.y);
        ctx.lineTo(endX, endY);
        ctx.stroke();
      }
    }
    function stopDraw() { isDrawing = false; }

    /* Templates Picker */
    function openTemplatePicker() {
      Swal.fire({
        title: 'ရိုးရာအင်း ၅ မျိုး (နမူနာ)',
        input: 'select',
        inputOptions: {
          'thambuddhe': '၁။ သမ္ဗုဒ္ဓေ ၄x၄ ရိုးရိုးအင်း',
          'datkyi': '၂။ ဓာတ်ကြီး ၄ ပါး ၃x၃ အင်း',
          'sittakan': '၃။ စိတ္တကံ စက်ဝိုင်းအင်း',
          'navagraha': '၄။ နဝင်း ၃x၃ အင်းကွက်',
          'blankCanvas': '၅။ ကိုယ်တိုင်ဆွဲရန် ကင်းဗတ်အလွတ်'
        },
        inputPlaceholder: 'နမူနာတစ်ခု ရွေးချယ်ပါ',
        showCancelButton: true, confirmButtonText: 'ဖန်တီးမည်', confirmButtonColor: '#8b0000'
      }).then((result) => {
        if (result.isConfirmed && result.value) applyPresetTemplate(result.value);
      });
    }

    function applyPresetTemplate(key) {
      saveState();
      if (key === 'thambuddhe') {
        switchMode('grid'); switchGridSize(4, 4);
        gridData['4x4'] = ['သ', 'ဓု', 'အ', 'သု', 'န', 'မော', 'ဗု', 'ဒ္ဓံ', 'ဇ', 'ယ', 'မံ', 'ဂ', 'လံ', 'ပု', 'တ္တံ', 'သိ'];
        renderGrid();
      } else if (key === 'datkyi') {
        switchMode('grid'); switchGridSize(3, 3);
        gridData['3x3'] = ['ပ', 'ထ', 'ဝီ', 'တေ', 'ဇော', 'အာ', 'ပေါ', 'ဝါ', 'ယော'];
        renderGrid();
      } else if (key === 'navagraha') {
        switchMode('grid'); switchGridSize(3, 3);
        gridData['3x3'] = ['၄', '၉', '၂', '၃', '၅', '၇', '၈', '၁', '၆'];
        renderGrid();
      } else if (key === 'sittakan') {
        switchMode('circle');
        circleData = ['န', 'ရ', 'ဓ', 'မ', 'စ', '၀', 'ည', 'ဝ', 'င', 'သ', 'မ', 'ဂ', 'ဂ', 'ဉ', 'ဒ', 'ပ'];
        renderCircleCells();
      } else if (key === 'blankCanvas') {
        switchMode('canvas');
        initCanvas();
      }
    }

    /* Undo / Redo Global */
    function undoAction() {
      if (undoStack.length === 0) return;
      redoStack.push({ mode: currentMode, grid: JSON.parse(JSON.stringify(gridData)), circle: [...circleData] });
      const prev = undoStack.pop();
      currentMode = prev.mode; gridData = prev.grid; circleData = prev.circle;
      if (currentMode === 'grid') renderGrid(); else if (currentMode === 'circle') renderCircleCells();
      updateUndoRedoUI();
    }
    function redoAction() {
      if (redoStack.length === 0) return;
      undoStack.push({ mode: currentMode, grid: JSON.parse(JSON.stringify(gridData)), circle: [...circleData] });
      const next = redoStack.pop();
      currentMode = next.mode; gridData = next.grid; circleData = next.circle;
      if (currentMode === 'grid') renderGrid(); else if (currentMode === 'circle') renderCircleCells();
      updateUndoRedoUI();
    }

    function clearCurrentMode() {
      Swal.fire({ title: 'ရှင်းလင်းမည်လား?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#8b0000', confirmButtonText: 'ဖျက်မည်' }).then((result) => {
        if (result.isConfirmed) {
          saveState();
          if (currentMode === 'grid') { gridData[`${rowsCount}x${colsCount}`] = Array(rowsCount * colsCount).fill(''); renderGrid(); } 
          else if (currentMode === 'circle') { circleData = Array(16).fill(''); renderCircleCells(); } 
          else { initCanvas(); }
        }
      });
    }

    function changeFontFamily() { document.documentElement.style.setProperty('--selected-font', document.getElementById('fontSelect').value); }
    function changeTextColor() { document.documentElement.style.setProperty('--cell-text-color', document.getElementById('textColorSelect').value); }
    function changeBgColor() { 
      const color = document.getElementById('bgColorSelect').value;
      document.documentElement.style.setProperty('--bg', color);
      document.documentElement.style.setProperty('--cell-bg-color', (color==='#f5f2eb') ? '#faf8f5' : color);
      if (currentMode === 'canvas') clearCanvasBackground();
    }
    function changeBorderColor() { 
      document.documentElement.style.setProperty('--grid-border-color', document.getElementById('borderColorSelect').value);
      if (currentMode === 'circle') renderCircleSVG();
      if (currentMode === 'canvas') clearCanvasBackground();
    }
    function changeFontSize(size) { 
      document.documentElement.style.setProperty('--font-size', size + 'px');
      document.getElementById('fontSizeVal').innerText = size + 'px';
      if (currentMode === 'grid') renderGrid();
      if (currentMode === 'circle') renderCircleCells();
    }

    function saveAsImage() {
      closeKeypad();
      document.querySelectorAll('.floating-text').forEach(t => t.blur()); // Remove border focus before capture
      const captureElement = document.getElementById('captureArea');
      html2canvas(captureElement, { scale: 3, backgroundColor: document.getElementById('bgColorSelect').value, useCORS: true })
      .then(canvasImg => {
        const link = document.createElement('a'); link.download = `amulet-${currentMode}-${Date.now()}.png`;
        link.href = canvasImg.toDataURL('image/png'); link.click();
      }).catch(err => { Swal.fire('အမှား', 'ပုံထုတ်ယူရာတွင် အမှားအယွင်းရှိခဲ့ပါသည်။', 'error'); });
    }

    switchMode('grid');
  </script>
</body>
</html>
